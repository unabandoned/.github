name: reusable-ci

# Shared CI for every @unabandoned/* fork. Callers set the Node matrix and
# whether a build step runs before the test suite.
on:
  workflow_call:
    inputs:
      node-versions:
        description: 'JSON array of Node.js major versions to test against.'
        type: string
        default: '[20, 22, 24]'
      has-build:
        description: 'Run `npm run build` before the test suite (TS/compiled forks).'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(inputs.node-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - if: ${{ inputs.has-build }}
        run: npm run build
      - run: npm test

  # Validate the fork's `.unabandoned.yml` (dashboard metadata) against the
  # shared schema, so a fork can't merge broken metadata or silently drift out
  # of the dashboard. Runs once (not per Node version); a no-op for the rare
  # repo that carries no metadata file. The validator is the single source of
  # truth for the schema - it lives in unabandoned/.github and is checked out
  # here rather than duplicated inline.
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the metadata validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: unabandoned/.github
          # Pin the validator to THIS reusable workflow's version - the ref the
          # caller pinned - instead of main, so a fork's pinned reusable-CI
          # version fully determines its CI behaviour and a validator change
          # ships via a new reusable-workflow release rather than silently to
          # every fork. github.job_workflow_sha is the commit SHA of this
          # reusable workflow file for the current job.
          ref: ${{ github.job_workflow_sha }}
          path: .unabandoned-ci
          persist-credentials: false
      - name: Validate .unabandoned.yml
        run: |
          if [ ! -f .unabandoned.yml ]; then
            echo "No .unabandoned.yml in this repo - nothing to validate."
            exit 0
          fi
          python3 -m venv .venv
          .venv/bin/pip install --quiet pyyaml
          .venv/bin/python .unabandoned-ci/scripts/validate_metadata.py .unabandoned.yml

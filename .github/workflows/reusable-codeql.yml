name: reusable-codeql

# Shared CodeQL analysis for JS/TS forks. Callers trigger on push/PR/schedule.
# Action refs use major-version tags; Renovate (helpers:pinGitHubActionDigests-
# ToSemver, inherited from the shared preset) pins them to digests on first run.
on:
  workflow_call:
    inputs:
      languages:
        description: 'CodeQL languages to analyze (comma-separated).'
        type: string
        default: 'javascript-typescript'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ inputs.languages }}
          # Analyze the shipped library code, not the test tree. Fork test
          # suites carry intentionally-malformed fixtures (to exercise syntax-
          # error handling) that CodeQL cannot parse, plus harness code that
          # runs bundles via vm.runInNewContext which trips false-positive
          # code-injection alerts. Neither is the security target for a library.
          config: |
            paths-ignore:
              - test
              - tests
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

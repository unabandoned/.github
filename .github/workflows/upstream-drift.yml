name: upstream-drift

# A fork can be perfectly maintained here and still be missing commits its
# upstream made after we forked it. This checks every repo in the org monthly
# and keeps a single issue up to date with the answer.
#
# It reports rather than acts: upstream CI, funding and lint config routinely
# conflicts with what this org standardises on, so what to pull is a judgement
# call, not something to automate.
on:
  schedule:
    # Day after release-cut (0 6 1 * *), so a drift report lands against a tree
    # that has just been released rather than mid-cut.
    - cron: '0 6 2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check every fork against its upstream
        id: check
        env:
          # Needs read across the org, and write on this repo to file the
          # issue; the default GITHUB_TOKEN is scoped to this repo only.
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          set -o pipefail
          python3 scripts/upstream_drift.py \
            --markdown "$RUNNER_TEMP/drift.md" \
            --json "$RUNNER_TEMP/drift.json" && status=0 || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/drift.json') as fh:
              data = json.load(fh)
          drifted = [r for r in data['results'] if r['state'] == 'drifted']
          print('drifted=%d' % len(drifted))
          print('errors=%d' % len(data['errors']))
          PY

      - name: File or update the report
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          DRIFTED: ${{ steps.check.outputs.drifted }}
          ERRORS: ${{ steps.check.outputs.errors }}
        run: |
          TITLE="Upstream drift report"
          BODY_FILE="$RUNNER_TEMP/drift.md"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$TITLE in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)

          if [ "$DRIFTED" = "0" ] && [ "$ERRORS" = "0" ]; then
            # Nothing to act on. Close a stale report rather than leaving an
            # issue open that no longer describes reality.
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" \
                --body "No forks are behind upstream as of this run. Closing; a future run will reopen a report if that changes."
              gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY"
            fi
            echo "No drift and no errors; nothing to file."
            exit 0
          fi

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE"
            echo "Updated issue #$EXISTING"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$BODY_FILE"
          fi

      - name: Fail if any repo could not be checked
        if: steps.check.outputs.status != '0'
        run: |
          echo "::error::One or more repos could not be checked - see the issue body. A failed check is not a clean check."
          exit 1
